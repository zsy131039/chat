<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微信网页版</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="logo">💬</div>
    <h2>微信网页版</h2>
    <input type="text" id="usernameInput" placeholder="请输入你的名称" maxlength="20">
    <button id="loginBtn">进入聊天</button>
    <p class="hint">登录后名称与 IP 归属地将对其他人可见</p>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="user-avatar" id="myAvatar">我</div>
      <div class="search-box">
        <input type="text" placeholder="搜索" id="searchInput">
        <button id="addBtn" class="add-btn">+</button>
      </div>
    </div>
    <div id="addMenu" class="add-menu hidden">
      <div class="menu-item" id="menuNewGroup"><span class="icon">💬</span> 发起群聊</div>
      <div class="menu-item" id="menuAddFriend"><span class="icon">👤</span> 添加朋友</div>
      <div class="menu-item" id="menuNote"><span class="icon">📝</span> 写笔记</div>
    </div>
    <div class="sidebar-tabs">
      <div class="tab active" data-tab="chats">聊天</div>
      <div class="tab" data-tab="contacts">通讯录</div>
    </div>
    <div class="list-container" id="chatList"></div>
    <div class="list-container hidden" id="contactList"></div>
    <div class="sidebar-footer">
      <div class="my-info">
        <span id="currentUserName"></span>
        <span class="location" id="userLocation"></span>
      </div>
      <button id="logoutBtn">退出</button>
    </div>
  </aside>

  <main class="chat-area">
    <div id="emptyState" class="empty-state"><div class="empty-icon">💬</div></div>
    <div id="chatSession" class="chat-session hidden">
      <header class="chat-header">
        <h3 id="currentGroupName">群聊</h3>
        <span id="onlineCount"></span>
      </header>
      <div class="message-list" id="messageList"></div>
      <footer class="chat-input-bar">
        <input type="text" id="messageInput" placeholder="输入消息...">
        <button id="sendBtn">发送</button>
      </footer>
    </div>
  </main>
</div>

<div id="newGroupModal" class="modal hidden">
  <div class="modal-content">
    <h3>创建新群聊</h3>
    <input type="text" id="newGroupNameInput" placeholder="群聊名称" maxlength="30">
    <div class="modal-buttons">
      <button id="cancelNewGroup">取消</button>
      <button id="confirmNewGroup">创建</button>
    </div>
  </div>
</div>

<!-- 自动加载 Supabase 的备用 CDN 列表 -->
<script>
  const cdns = [
    'https://unpkg.zhimg.com/@supabase/supabase-js@2.39.8/dist/main/umd/supabase.min.js',
    'https://cdn.staticfile.org/supabase-js/2.39.8/supabase.min.js',
    'https://npm.elemecdn.com/@supabase/supabase-js@2.39.8/dist/main/umd/supabase.min.js',
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/main/umd/supabase.min.js'
  ];
  let currentIndex = 0;

  function loadSupabase() {
    if (currentIndex >= cdns.length) {
      alert('Supabase 库加载失败，请检查网络或更换网络环境！');
      return;
    }
    const url = cdns[currentIndex];
    const script = document.createElement('script');
    script.src = url;
    
    // 加载成功，启动 app.js
    script.onload = () => {
      console.log('Supabase 库加载成功！');
      const appScript = document.createElement('script');
      appScript.src = 'app.js';
      document.body.appendChild(appScript);
    };
    
    // 加载失败，尝试下一个
    script.onerror = () => {
      console.warn('当前 CDN 失败，尝试下一个...');
      currentIndex++;
      loadSupabase();
    };
    
    document.head.appendChild(script);
  }
  
  // 开始加载
  loadSupabase();
</script>
</body>
</html>
